<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Relationship Markers -->
    <marker id="circleStart" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" stroke="#0b0f19" stroke-width="1"/>
    </marker>
    <marker id="crowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 8 5 L 0 10 M 0 5 L 8 5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g id="header" transform="translate(40, 30)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Workflow Platform — Relational Database Schema &amp; Data Model</text>
    <text x="0" y="22" fill="#94a3b8" font-size="13">Multi-Tenant PostgreSQL Architecture • Row-Level Security (RLS) &amp; Transactional Outbox</text>
  </g>

  <!-- ==================== TABLE 1: WORKFLOWS (CENTRAL ENTITY) ==================== -->
  <g id="table-workflows" transform="translate(40, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="360" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#1e3a8a"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">workflows</text>
    <rect x="255" y="10" width="70" height="18" rx="4" fill="#2563eb"/>
    <text x="263" y="23" fill="#ffffff" font-size="10" font-weight="600">Core Table</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">id</text>
      <text x="130" y="0" fill="#94a3b8">uuid [PK]</text>

      <text x="0" y="22" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="22" fill="#facc15">varchar [RLS, IDX]</text>

      <text x="0" y="44" fill="#e2e8f0">type</text>
      <text x="130" y="44" fill="#94a3b8">varchar (EXPENSE...)</text>

      <text x="0" y="66" fill="#e2e8f0">title</text>
      <text x="130" y="66" fill="#94a3b8">varchar(255)</text>

      <text x="0" y="88" fill="#e2e8f0">status</text>
      <text x="130" y="88" fill="#34d399">varchar (DRAFT...)</text>

      <text x="0" y="110" fill="#e2e8f0">amount</text>
      <text x="130" y="110" fill="#94a3b8">decimal(15, 2)</text>

      <text x="0" y="132" fill="#e2e8f0">currency</text>
      <text x="130" y="132" fill="#94a3b8">varchar(3) [USD/JPY]</text>

      <text x="0" y="154" fill="#e2e8f0">requester_id</text>
      <text x="130" y="154" fill="#94a3b8">varchar(64)</text>

      <text x="0" y="176" fill="#e2e8f0">requester_name</text>
      <text x="130" y="176" fill="#94a3b8">varchar(128)</text>

      <text x="0" y="198" fill="#e2e8f0">current_step_order</text>
      <text x="130" y="198" fill="#94a3b8">int (active step)</text>

      <text x="0" y="220" fill="#e2e8f0">total_steps</text>
      <text x="130" y="220" fill="#94a3b8">int (total tiers)</text>

      <text x="0" y="242" fill="#e2e8f0">rejection_reason</text>
      <text x="130" y="242" fill="#f87171">text (mandatory)</text>

      <text x="0" y="264" fill="#64748b">created_at</text>
      <text x="130" y="264" fill="#64748b">timestamptz</text>

      <text x="0" y="286" fill="#64748b">updated_at</text>
      <text x="130" y="286" fill="#64748b">timestamptz</text>
    </g>
  </g>

  <!-- ==================== TABLE 2: WORKFLOW_STEPS ==================== -->
  <g id="table-steps" transform="translate(430, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="360" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#064e3b"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">workflow_steps</text>
    <rect x="235" y="10" width="90" height="18" rx="4" fill="#047857"/>
    <text x="243" y="23" fill="#ffffff" font-size="10" font-weight="600">Step Hierarchy</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">id</text>
      <text x="130" y="0" fill="#94a3b8">uuid [PK]</text>

      <text x="0" y="22" fill="#38bdf8" font-weight="700">workflow_id</text>
      <text x="130" y="22" fill="#38bdf8">uuid [FK -&gt; workflows]</text>

      <text x="0" y="44" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="44" fill="#facc15">varchar [RLS, IDX]</text>

      <text x="0" y="66" fill="#e2e8f0">step_order</text>
      <text x="130" y="66" fill="#94a3b8">int (1, 2, 3...)</text>

      <text x="0" y="88" fill="#e2e8f0">step_role</text>
      <text x="130" y="88" fill="#94a3b8">varchar (team_lead...)</text>

      <text x="0" y="110" fill="#e2e8f0">status</text>
      <text x="130" y="110" fill="#34d399">varchar (WAITING...)</text>

      <text x="0" y="132" fill="#e2e8f0">policy</text>
      <text x="130" y="132" fill="#94a3b8">varchar (ALL/ANY)</text>

      <text x="0" y="154" fill="#e2e8f0">parallel_group</text>
      <text x="130" y="154" fill="#94a3b8">varchar(64) (gate-1)</text>

      <text x="0" y="176" fill="#e2e8f0">approver_id</text>
      <text x="130" y="176" fill="#94a3b8">varchar(64)</text>

      <text x="0" y="198" fill="#e2e8f0">approver_name</text>
      <text x="130" y="198" fill="#94a3b8">varchar(128)</text>

      <text x="0" y="220" fill="#e2e8f0">comment</text>
      <text x="130" y="220" fill="#94a3b8">text</text>

      <text x="0" y="242" fill="#e2e8f0">is_delegated</text>
      <text x="130" y="242" fill="#c084fc">boolean</text>

      <text x="0" y="264" fill="#64748b">approved_at</text>
      <text x="130" y="264" fill="#64748b">timestamptz</text>
    </g>
  </g>

  <!-- ==================== TABLE 3: DELEGATIONS ==================== -->
  <g id="table-delegations" transform="translate(820, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="260" rx="8" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#4c1d95"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">delegations</text>
    <rect x="235" y="10" width="90" height="18" rx="4" fill="#6d28d9"/>
    <text x="243" y="23" fill="#ffffff" font-size="10" font-weight="600">OOO Authority</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">id</text>
      <text x="130" y="0" fill="#94a3b8">uuid [PK]</text>

      <text x="0" y="24" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="24" fill="#facc15">varchar [RLS, IDX]</text>

      <text x="0" y="48" fill="#e2e8f0">delegator_id</text>
      <text x="130" y="48" fill="#94a3b8">varchar(64)</text>

      <text x="0" y="72" fill="#e2e8f0">delegatee_id</text>
      <text x="130" y="72" fill="#c084fc">varchar(64) (Proxy)</text>

      <text x="0" y="96" fill="#e2e8f0">reason</text>
      <text x="130" y="96" fill="#94a3b8">varchar(255)</text>

      <text x="0" y="120" fill="#e2e8f0">valid_from</text>
      <text x="130" y="120" fill="#34d399">timestamptz (UTC)</text>

      <text x="0" y="144" fill="#e2e8f0">valid_until</text>
      <text x="130" y="144" fill="#34d399">timestamptz (UTC)</text>

      <text x="0" y="168" fill="#64748b">created_at</text>
      <text x="130" y="168" fill="#64748b">timestamptz</text>
    </g>
  </g>

  <!-- ==================== TABLE 4: OUTBOX_EVENTS ==================== -->
  <g id="table-outbox" transform="translate(40, 480)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="280" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#78350f"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">outbox_events</text>
    <rect x="215" y="10" width="110" height="18" rx="4" fill="#b45309"/>
    <text x="223" y="23" fill="#ffffff" font-size="10" font-weight="600">Transactional Outbox</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">id</text>
      <text x="130" y="0" fill="#94a3b8">uuid [PK, CloudEvent]</text>

      <text x="0" y="24" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="24" fill="#facc15">varchar [RLS, IDX]</text>

      <text x="0" y="48" fill="#e2e8f0">event_type</text>
      <text x="130" y="48" fill="#fb923c">varchar (submitted.v1...)</text>

      <text x="0" y="72" fill="#e2e8f0">payload</text>
      <text x="130" y="72" fill="#fde68a">jsonb (CloudEvents 1.0)</text>

      <text x="0" y="96" fill="#e2e8f0">published</text>
      <text x="130" y="96" fill="#34d399">boolean (false / true)</text>

      <text x="0" y="120" fill="#e2e8f0">retry_count</text>
      <text x="130" y="120" fill="#94a3b8">int</text>

      <text x="0" y="144" fill="#e2e8f0">last_error</text>
      <text x="130" y="144" fill="#f87171">text</text>

      <text x="0" y="168" fill="#64748b">created_at</text>
      <text x="130" y="168" fill="#64748b">timestamptz</text>

      <text x="0" y="192" fill="#64748b">published_at</text>
      <text x="130" y="192" fill="#64748b">timestamptz</text>
    </g>
  </g>

  <!-- ==================== TABLE 5: IDEMPOTENCY_KEYS ==================== -->
  <g id="table-idemp" transform="translate(430, 480)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="230" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#155e75"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">idempotency_keys</text>
    <rect x="225" y="10" width="100" height="18" rx="4" fill="#0e7490"/>
    <text x="233" y="23" fill="#ffffff" font-size="10" font-weight="600">Deduplication</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">key</text>
      <text x="130" y="0" fill="#38bdf8">varchar(128) [PK]</text>

      <text x="0" y="24" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="24" fill="#facc15">varchar [RLS, IDX]</text>

      <text x="0" y="48" fill="#e2e8f0">status_code</text>
      <text x="130" y="48" fill="#34d399">int (200, 201...)</text>

      <text x="0" y="72" fill="#e2e8f0">response_body</text>
      <text x="130" y="72" fill="#a5f3fc">jsonb (Cached Result)</text>

      <text x="0" y="96" fill="#64748b">created_at</text>
      <text x="130" y="96" fill="#64748b">timestamptz</text>

      <text x="0" y="120" fill="#64748b">expires_at</text>
      <text x="130" y="120" fill="#64748b">timestamptz (24h TTL)</text>
    </g>
  </g>

  <!-- ==================== TABLE 6: AUDIT_EVENTS (AUDIT_DB) ==================== -->
  <g id="table-audit" transform="translate(820, 380)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="280" rx="8" fill="#111827" stroke="#ec4899" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="#831843"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">audit_events (audit_db)</text>
    <rect x="225" y="10" width="100" height="18" rx="4" fill="#9d174d"/>
    <text x="233" y="23" fill="#ffffff" font-size="10" font-weight="600">Compliance Log</text>

    <!-- Columns -->
    <g transform="translate(15, 60)" font-size="11">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">id</text>
      <text x="130" y="0" fill="#38bdf8">uuid [PK, Event ID]</text>

      <text x="0" y="24" fill="#facc15" font-weight="700">tenant_id</text>
      <text x="130" y="24" fill="#facc15">varchar [IDX]</text>

      <text x="0" y="48" fill="#e2e8f0">event_type</text>
      <text x="130" y="48" fill="#f472b6">varchar(64)</text>

      <text x="0" y="72" fill="#e2e8f0">workflow_id</text>
      <text x="130" y="72" fill="#94a3b8">varchar(64) [IDX]</text>

      <text x="0" y="96" fill="#e2e8f0">actor_id</text>
      <text x="130" y="96" fill="#94a3b8">varchar(64)</text>

      <text x="0" y="120" fill="#e2e8f0">actor_name</text>
      <text x="130" y="120" fill="#94a3b8">varchar(128)</text>

      <text x="0" y="144" fill="#e2e8f0">event_data</text>
      <text x="130" y="144" fill="#fbcfe8">jsonb</text>

      <text x="0" y="168" fill="#64748b">occurred_at</text>
      <text x="130" y="168" fill="#64748b">timestamptz</text>

      <text x="0" y="192" fill="#64748b">recorded_at</text>
      <text x="130" y="192" fill="#64748b">timestamptz</text>
    </g>
  </g>

  <!-- ==================== RELATIONSHIP LINES ==================== -->
  <!-- workflows (1) -> (N) workflow_steps -->
  <path d="M 380 200 L 430 200" stroke="#38bdf8" stroke-width="2" marker-start="url(#circleStart)" marker-end="url(#crowEnd)"/>
  <text x="390" y="192" fill="#38bdf8" font-size="10" font-weight="700">1 : N</text>

  <!-- workflows (1) -> (N) outbox_events -->
  <path d="M 210 435 L 210 480" stroke="#f59e0b" stroke-width="2" marker-start="url(#circleStart)" marker-end="url(#crowEnd)"/>
  <text x="218" y="460" fill="#f59e0b" font-size="10" font-weight="700">1 : N</text>

  <!-- workflows (1) -> (N) idempotency_keys -->
  <path d="M 380 320 L 400 320 L 400 560 L 430 560" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#circleStart)" marker-end="url(#crowEnd)"/>
  <text x="405" y="460" fill="#06b6d4" font-size="10" font-weight="700">1 : N</text>

  <!-- delegations -> workflow_steps -->
  <path d="M 820 180 L 770 180" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="780" y="172" fill="#a855f7" font-size="9" font-weight="700">OOO</text>
</svg>
